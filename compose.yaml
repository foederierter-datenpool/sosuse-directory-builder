services:
  pipeline:
    build:
      context: .
      dockerfile: deploy/pipeline.Dockerfile
    init: true
    restart: unless-stopped
    environment:
      GITHUB_PUSH_TOKEN: ${GH_PAGES_TOKEN:-}
      GEOCODE_ENDPOINT: ${PIPELINE_GEOCODE_ENDPOINT:-http://nominatim:8080/search}
      GEOCODE_DELAY_MS: ${PIPELINE_GEOCODE_DELAY_MS:-0}
      GEOCODE_DATASET: ${PIPELINE_GEOCODE_DATASET:-}
      GEOCODE_RETRY_MISSES: ${PIPELINE_GEOCODE_RETRY_MISSES:-false}
      GEOCODE_CACHE_ONLY: ${PIPELINE_GEOCODE_CACHE_ONLY:-false}
    volumes:
      - pipeline-workspace:/workspace

volumes:
  pipeline-workspace:
