name: Deploy webapp

on:
    push:
        branches: [main, gh-pages]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Check out webapp inputs from main
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref == 'refs/heads/main' && github.sha || 'main' }}
                  persist-credentials: false

            - name: Check out published pipeline snapshot
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref == 'refs/heads/gh-pages' && github.sha || 'gh-pages' }}
                  path: .publication
                  sparse-checkout: |
                      config
                      data
                  persist-credentials: false

            - name: Use published data and matching configuration
              run: |
                  rm -rf config data
                  mv .publication/config .publication/data .
                  test -s data/directory.ttl

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - run: npm install

            - run: npm run webapp:build

            - uses: actions/configure-pages@v5

            - uses: actions/upload-pages-artifact@v4
              with:
                  path: webapp/dist

            - uses: actions/deploy-pages@v4
              id: deployment
